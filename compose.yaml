name: ${COMPOSE_PROJECT_NAME:-maison-rivage}

x-wp-environment: &wp-environment
  WORDPRESS_DB_HOST: db:3306
  WORDPRESS_DB_NAME: ${DB_NAME:?Run ./bin/dev init first}
  WORDPRESS_DB_USER: ${DB_USER:?Run ./bin/dev init first}
  WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?Run ./bin/dev init first}
  WORDPRESS_DEBUG: "1"
  WORDPRESS_CONFIG_EXTRA: |
    define('WP_ENVIRONMENT_TYPE', 'local');
    define('WP_DEBUG_LOG', true);
    define('WP_DEBUG_DISPLAY', false);
    define('DISALLOW_FILE_EDIT', true);
    define('DISABLE_WP_CRON', true);
    define('AUTOMATIC_UPDATER_DISABLED', true);
  RIVAGE_SMTP_HOST: mailpit
  RIVAGE_SMTP_PORT: "1025"

services:
  db:
    image: mariadb:11.4@sha256:5e73baf8179b29f115101bb102763a47a017361f3e9792daccba6646c3ab1532
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Run ./bin/dev init first}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:7.1.4-php8.3-apache@sha256:8b64037bb2a3bdc41bebccb165f20ad5e4c786b684ae4a2bd5981f98aa1eb107
    ports:
      - "127.0.0.1:${WORDPRESS_PORT:-8080}:80"
    environment: *wp-environment
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes: &wp-volumes
      - wordpress:/var/www/html
      - ./wp-content/themes/maison-rivage:/var/www/html/wp-content/themes/maison-rivage:ro
      - ./wp-content/plugins/maison-rivage-core:/var/www/html/wp-content/plugins/maison-rivage-core:ro
      - ./wp-content/mu-plugins/rivage-local-mail.php:/var/www/html/wp-content/mu-plugins/rivage-local-mail.php:ro
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/rivage-local.ini:ro
      - ./scripts:/workspace/scripts:ro
    healthcheck:
      test: [CMD, php, -r, "exit(@fsockopen('127.0.0.1', 80) ? 0 : 1);"]
      interval: 5s
      timeout: 5s
      retries: 30

  cli:
    image: wordpress:cli-php8.3@sha256:a4fff017eb08c03187e90fe52d4bff8d3a4d4a5103de05829a6e747c4ca3056e
    user: "33:33"
    profiles: [tools]
    environment:
      <<: *wp-environment
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
      WP_URL: ${WP_URL:-http://localhost:8080}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
    volumes: *wp-volumes
    depends_on:
      wordpress:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

  scheduler:
    image: wordpress:cli-php8.3@sha256:a4fff017eb08c03187e90fe52d4bff8d3a4d4a5103de05829a6e747c4ca3056e
    user: "33:33"
    entrypoint: [sh, -c]
    command:
      - 'while true; do if wp core is-installed 2>/dev/null; then wp cron event run --due-now --quiet; fi; sleep 60; done'
    environment:
      <<: *wp-environment
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    volumes: *wp-volumes
    depends_on:
      wordpress:
        condition: service_healthy

volumes:
  database:
  wordpress:
